[project]
name = "poolmath"
version = "0.1.0"
description = "Self-hosted TFP-methodology pool chemistry app"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pypoolchem>=0.1.1,<0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poolmath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
